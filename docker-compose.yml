version: '3.8'

services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: edubio
      MYSQL_USER: edubio_user
      MYSQL_PASSWORD: edubio_password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  app:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - ./public:/usr/src/app/public
      - ./server.js:/usr/src/app/server.js
    environment:
      - DB_HOST=db
      - DB_USER=edubio_user
      - DB_PASSWORD=edubio_password
      - DB_NAME=edubio
      - JWT_SECRET=supersecret_sk_thonburi_key
    depends_on:
      - db

volumes:
  db_data:

<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduBio - ยินดีต้อนรับ</title>
    <link rel="stylesheet" href="login.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Noto+Sans+Thai:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="font-inter">
    <div class="container bg-white p-8 sm:p-12 rounded-3xl shadow-2xl max-w-lg w-full relative z-10 animate-fade-in-up">
        <span class="absolute top-4 left-4 text-5xl opacity-30 animate-bounce-slow" style="animation-delay: 0s;">🌱</span>
        <span class="absolute bottom-4 right-4 text-5xl opacity-30 animate-bounce-slow" style="animation-delay: 0.5s;">🔬</span>
        <span class="absolute top-1/4 right-8 text-4xl opacity-30 animate-bounce-slow" style="animation-delay: 1s;">🦠</span>
        <span class="absolute bottom-1/4 left-8 text-4xl opacity-30 animate-bounce-slow" style="animation-delay: 1.5s;">🌿</span>

        <!-- Header Section -->
        <div class="text-center mb-8">
            <h1 class="text-5xl font-extrabold text-green-800 mb-4">
                EduBio
            </h1>
            <p class="text-gray-700 text-lg">แหล่งเรียนรู้ชีววิทยาออนไลน์ของคุณ</p>
        </div>

        <!-- Auth Buttons Section -->
        <div class="space-y-5">
            <button id="signupBtn" class="w-full bg-gradient-to-r from-green-500 to-green-600 hover:from-green-600 hover:to-green-700 text-white font-bold py-4 px-8 rounded-full shadow-lg transition duration-300 ease-in-out transform hover:scale-105 flex items-center justify-center focus:outline-none focus:ring-4 focus:ring-green-400 focus:ring-opacity-75">
                <i class="fas fa-user-plus mr-3 text-2xl"></i>
                <span>สมัครสมาชิก</span>
            </button>

            <button id="loginBtn" class="w-full bg-gradient-to-r from-green-500 to-green-600 hover:from-green-600 hover:to-green-700 text-white font-bold py-4 px-8 rounded-full shadow-lg transition duration-300 ease-in-out transform hover:scale-105 flex items-center justify-center focus:outline-none focus:ring-4 focus:ring-green-400 focus:ring-opacity-75">
                <i class="fas fa-sign-in-alt mr-3 text-2xl"></i>
                <span>เข้าสู่ระบบ</span>
            </button>
        </div>

        <!-- Optional: Footer text or links -->
        <p class="text-center text-gray-500 text-sm mt-8">
            &copy; 2025 EduBio. All rights reserved.
        </p>
    </div>

    <!-- Sign Up Modal -->
    <div class="modal" id="signupModal">
        <div class="modal-content-custom">
            <h2 class="text-2xl font-bold mb-6 text-gray-800">สมัครสมาชิก</h2>
            <input type="text" placeholder="ชื่อผู้ใช้" id="signupUsername" class="block w-full p-3 mb-4 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-400">
            <input type="email" placeholder="อีเมล" id="signupEmail" class="block w-full p-3 mb-4 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-400">
            
            <div class="password-group relative mb-4">
                <input type="password" placeholder="รหัสผ่าน" id="signupPassword" class="block w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-400">
                <span class="togglePassword absolute right-3 top-1/2 -translate-y-1/2 cursor-pointer text-xl text-gray-500">👁️</span>
            </div>
            <div class="password-group relative mb-6">
                <input type="password" placeholder="ยืนยันรหัสผ่าน" id="signupConfirmPassword" class="block w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-400">
                <span class="togglePassword absolute right-3 top-1/2 -translate-y-1/2 cursor-pointer text-xl text-gray-500">👁️</span>
            </div>

            <button id="signupSubmit" class="bg-gradient-to-r from-green-500 to-green-600 hover:from-green-600 hover:to-green-700 text-white font-bold py-3 px-6 rounded-full transition duration-300 ease-in-out transform hover:scale-105 mb-3 w-full">
                สมัครสมาชิก
            </button>
            <button class="closeBtn bg-gray-400 hover:bg-gray-500 text-white font-bold py-3 px-6 rounded-full transition duration-300 ease-in-out transform hover:scale-105 w-full">
                ปิด
            </button>
        </div>
    </div>

    <!-- Login Modal -->
    <div class="modal" id="loginModal">
        <div class="modal-content-custom">
            <h2 class="text-2xl font-bold mb-6 text-gray-800">เข้าสู่ระบบ</h2>
            <button id="googleLogin" class="bg-gradient-to-r from-red-500 to-red-600 hover:from-red-600 hover:to-red-700 text-white font-bold py-3 px-6 rounded-full transition duration-300 ease-in-out transform hover:scale-105 mb-5 w-full flex items-center justify-center">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google icon" class="w-5 h-5 mr-3">
                เข้าสู่ระบบด้วย Google
            </button>
            <div class="relative flex py-5 items-center">
                <div class="flex-grow border-t border-gray-300"></div>
                <span class="flex-shrink mx-4 text-gray-500">หรือ</span>
                <div class="flex-grow border-t border-gray-300"></div>
            </div>
            <input type="email" placeholder="อีเมล" id="loginEmail" class="block w-full p-3 mb-4 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-400">
            
            <div class="password-group relative mb-6">
                <input type="password" placeholder="รหัสผ่าน" id="loginPassword" class="block w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-400">
                <span class="togglePassword absolute right-3 top-1/2 -translate-y-1/2 cursor-pointer text-xl text-gray-500">👁️</span>
            </div>

            <button id="loginSubmit" class="bg-gradient-to-r from-green-500 to-green-600 hover:from-green-600 hover:to-green-700 text-white font-bold py-3 px-6 rounded-full transition duration-300 ease-in-out transform hover:scale-105 mb-3 w-full">
                เข้าสู่ระบบ
            </button>
            <button class="closeBtn bg-gray-400 hover:bg-gray-500 text-white font-bold py-3 px-6 rounded-full transition duration-300 ease-in-out transform hover:scale-105 w-full">
                ปิด
            </button>
        </div>
    </div>

    <!-- Message Modal -->
    <div class="modal" id="messageModal">
        <div class="modal-content-custom">
            <h2 id="messageModalTitle" class="text-2xl font-bold mb-6 text-gray-800"></h2>
            <p id="messageModalBody" class="text-gray-700"></p>
            <button id="messageModalCloseBtn" class="bg-green-500 hover:bg-green-600 text-white font-semibold py-3 px-6 rounded-lg transition duration-300 ease-in-out mt-6">
                ตกลง
            </button>
        </div>
    </div>
    <script type="module" src="login.js"></script>
</body>
</html>

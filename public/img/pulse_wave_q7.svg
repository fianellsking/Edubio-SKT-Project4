<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 250" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" rx="16" fill="url(#bgGrad)" />

  <!-- Grid lines -->
  <line x1="50" y1="180" x2="550" y2="180" stroke="#475569" stroke-width="2" stroke-dasharray="6,6" />
  
  <!-- Wave Pulse Line -->
  <!-- Baseline y=180, Pulse peak at x=300, y=60 -->
  <path d="M 50 180 L 180 180 C 220 180, 250 60, 300 60 C 350 60, 380 180, 420 180 L 550 180" 
        fill="none" stroke="url(#waveGrad)" stroke-width="6" stroke-linecap="round" filter="url(#glow)" />

  <!-- Velocity Arrow v -->
  <g transform="translate(340, 40)">
    <line x1="0" y1="0" x2="60" y2="0" stroke="#fbbf24" stroke-width="4" stroke-linecap="round" />
    <polygon points="60,-7 72,0 60,7" fill="#fbbf24" />
    <text x="25" y="-12" fill="#fbbf24" font-family="sans-serif" font-size="20" font-weight="bold">v</text>
  </g>

  <!-- Labeled Point A (Left slope, x=240, y=120) -->
  <circle cx="240" cy="120" r="8" fill="#ef4444" stroke="#ffffff" stroke-width="2" filter="url(#glow)" />
  <text x="220" y="110" fill="#fca5a5" font-family="sans-serif" font-size="22" font-weight="bold">A</text>

  <!-- Labeled Point B (Peak, x=300, y=60) -->
  <circle cx="300" cy="60" r="8" fill="#10b981" stroke="#ffffff" stroke-width="2" filter="url(#glow)" />
  <text x="293" y="42" fill="#6ee7b7" font-family="sans-serif" font-size="22" font-weight="bold">B</text>

  <!-- Labeled Point C (Right slope, x=360, y=120) -->
  <circle cx="360" cy="120" r="8" fill="#3b82f6" stroke="#ffffff" stroke-width="2" filter="url(#glow)" />
  <text x="375" y="110" fill="#93c5fd" font-family="sans-serif" font-size="22" font-weight="bold">C</text>

  <!-- Axis Title / Description -->
  <text x="300" y="225" fill="#94a3b8" font-family="sans-serif" font-size="16" text-anchor="middle">ทิศทางการเคลื่อนที่ของคลื่นดล (Pulse Wave)</text>
</svg>

<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduPhys - บทเรียนฟิสิกส์</title>
    <link rel="stylesheet" href="/css/tailwind.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Noto+Sans+Thai:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/lesson_detail.css">
</head>
<body class="font-noto text-gray-800 min-h-screen relative overflow-y-auto">

        <!-- Background Decorative Shapes -->
<div class="background-shape shape-1"></div>
<div class="background-shape shape-2"></div>
<div class="background-shape shape-3"></div>
<div class="background-shape shape-4"></div>
<div class="background-shape shape-5"></div>
<div class="background-shape shape-6"></div>

        <div class="container bg-white p-10 rounded-2xl shadow-2xl max-w-4xl w-full mx-auto my-8 border border-gray-200">
            <div class="flex justify-between items-center mb-6 border-b pb-4">
                <h1 id="lessonTitle" class="text-3xl font-extrabold text-blue-700"></h1>
                <button id="backToHomeBtn" class="bg-slate-500 hover:bg-slate-600 text-white font-semibold py-2 px-5 rounded-full transition duration-300 ease-in-out transform hover:scale-105 shadow-md">
                    กลับหน้าหลัก
                </button>
            </div>

            <!-- Section for Pre-test -->
            <div id="preTestSection" class="lesson-section mb-8 p-8 bg-amber-50/70 rounded-2xl shadow-lg border border-amber-200">
                <h2 class="text-2xl font-bold text-amber-900 mb-4 flex items-center gap-2"><span>📝</span> 1. แบบทดสอบก่อนเรียน</h2>
                <div id="preTestQuestions" class="mb-4">
                    <!-- Questions will be loaded here by JavaScript -->
                </div>
                <button id="submitPreTestBtn" class="bg-gradient-to-r from-amber-400 to-amber-500 hover:from-amber-500 hover:to-amber-600 text-slate-950 font-black py-3 px-8 rounded-full shadow-lg transition duration-300 ease-in-out transform hover:scale-105">
                    ส่งคำตอบ
                </button>
                <div id="preTestResult" class="mt-4 p-4 bg-amber-100/80 rounded-xl border border-amber-300 text-amber-950 hidden font-semibold">
                    <!-- Pre-test results will be shown here -->
                </div>
                <button id="continueToContentBtn" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 px-6 rounded-full transition duration-300 ease-in-out mt-4 hidden shadow-md">
                    เข้าสู่เนื้อหาบทเรียน
                </button>
                <div class="flex justify-center gap-4 mt-4">
                    <!-- Button to go back to main lessons/home after pre-test -->
                    <button id="backFromPreTestToHomeBtn" class="bg-slate-500 hover:bg-slate-600 text-white font-semibold py-3 px-8 rounded-full shadow-lg transition duration-300 ease-in-out transform hover:scale-105 hidden">
                        กลับสู่บทเรียนหลัก
                    </button>
                </div>
            </div>
<div id="generalSlidesContainer" class="mt-4 hidden"></div>


            <!-- Section for General Taxonomy Introduction (NEW) -->
            <div id="taxonomyIntroSection" class="lesson-section mb-8 p-8 bg-blue-50/70 rounded-2xl shadow-lg border border-blue-200 hidden">
                <h2 id="generalIntroTitle" class="text-2xl font-bold text-blue-900 mb-4 flex items-center gap-2"><span>🌊</span> ภาพรวมเนื้อหาเรื่องคลื่นกล</h2>
                <div id="generalIntroContent" class="prose max-w-none text-slate-700">
                    <!-- General introduction content from JS -->
                </div>
                <!-- General Taxonomy Slides Container (Added) -->
                <div id="generalTaxonomySlidesContainer" class="slides-container hidden">
                    <!-- Slides content will be injected here by JS -->
                </div>
                <!-- Controls for General Slides Toggle (Added) -->
                <div class="flex justify-center items-center mt-6 space-x-4">
                    <button id="toggleGeneralSlidesBtn" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-6 rounded-full transition duration-300 ease-in-out hidden">
                        แสดงสไลด์สรุปเนื้อหา
                    </button>
                </div>
                <div class="flex justify-between items-center mt-6 pt-4 border-t border-blue-100">
                    <button id="backToPreTestFromTaxonomyIntroBtn" class="bg-slate-500 hover:bg-slate-600 text-white font-semibold py-2.5 px-6 rounded-full transition duration-300 ease-in-out">
                        ย้อนกลับแบบทดสอบก่อนเรียน
                    </button>
                    <button id="startTaxonomyLessonBtn" class="bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-bold py-3 px-8 rounded-full shadow-lg transition duration-300 ease-in-out transform hover:scale-105">
                        ทำแบบทดสอบหลังเรียน ➡️
                    </button>
                </div>
            </div>

            <!-- Section for Post-test -->
            <div id="postTestSection" class="lesson-section mb-8 p-8 bg-indigo-50/70 rounded-2xl shadow-lg border border-indigo-200 hidden">
                <h2 class="text-2xl font-bold text-indigo-900 mb-4 flex items-center gap-2"><span>🎯</span> 2. แบบทดสอบหลังเรียน</h2>
                <div id="postTestQuestions" class="mb-4">
                    <!-- Questions will be loaded here by JavaScript -->
                </div>
                <button id="submitPostTestBtn" class="bg-gradient-to-r from-indigo-600 to-blue-600 hover:from-indigo-700 hover:to-blue-700 text-white font-bold py-3 px-8 rounded-full shadow-lg transition duration-300 ease-in-out transform hover:scale-105">
                    ส่งคำตอบ
                </button>
                <div id="postTestResult" class="mt-4 p-4 bg-indigo-100/80 rounded-xl border border-indigo-300 text-indigo-950 hidden font-semibold">
                    <!-- Post-test results will be shown here -->
                </div>
                <button id="viewScoresBtn" class="bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-700 hover:to-blue-700 text-white font-bold py-3 px-8 rounded-full shadow-lg transition duration-300 ease-in-out transform hover:scale-105 mt-4 hidden">
                    ดูสรุปคะแนน 🏆
                </button>
            </div>

            <!-- Section for Score Summary -->
            <div id="scoreSummarySection" class="lesson-section p-8 bg-gradient-to-br from-slate-50 to-blue-50 rounded-2xl shadow-xl border border-blue-200 hidden text-center">
                <h2 class="text-3xl font-extrabold text-blue-900 mb-6 flex justify-center items-center gap-2"><span>🏆</span> สรุปผลคะแนนของคุณ</h2>
                <div class="flex flex-col sm:flex-row justify-center items-center gap-6 my-6">
                    <div class="bg-white p-6 rounded-2xl border border-amber-200 shadow-md w-full sm:w-60">
                        <span class="block text-sm font-semibold text-amber-600 mb-1">ก่อนเรียน</span>
                        <span id="preScoreSummary" class="text-3xl font-black text-amber-900"></span>
                    </div>
                    <div class="bg-white p-6 rounded-2xl border border-indigo-200 shadow-md w-full sm:w-60">
                        <span class="block text-sm font-semibold text-indigo-600 mb-1">หลังเรียน (คะแนนสูงสุด)</span>
                        <span id="postScoreSummary" class="text-3xl font-black text-indigo-900"></span>
                        <span id="postAttemptsSummary" class="block text-xs font-medium text-slate-500 mt-2"></span>
                    </div>
                </div>
                <div class="flex flex-wrap justify-center gap-4 mt-6">
                    <button id="retryPostTestBtn" class="bg-gradient-to-r from-indigo-600 to-blue-600 hover:from-indigo-700 hover:to-blue-700 text-white font-bold py-3 px-8 rounded-full shadow-lg transition duration-300 transform hover:scale-105 hidden">
                        🔄 ทำข้อสอบหลังเรียนอีกครั้ง (เหลือสิทธิ์อีก 1 ครั้ง)
                    </button>
                    <button id="returnToHomeFromSummaryBtn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-full transition duration-300 ease-in-out shadow-lg">
                        กลับหน้าหลัก 🏠
                    </button>
                </div>
            </div>

        </div>

        <!-- Message Box for alerts -->
        <div class="message-box fixed inset-0 bg-black bg-opacity-60 flex justify-center items-center z-50 hidden" id="messageBox">
            <div class="message-box-content bg-white p-8 rounded-lg shadow-xl w-11/12 max-w-md text-center">
                <h2 id="messageBoxTitle" class="text-2xl font-bold text-gray-800 mb-4"></h2>
                <p id="messageBoxBody" class="text-gray-700 mb-6"></p>
                <button id="messageBoxCloseBtn" style="background-color: #3B82F6; color: #ffffff; padding: 12px 32px; border-radius: 9999px; font-weight: bold; border: none; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
                    ตกลง
                </button>
            </div>
        </div>

        <!-- Placeholder for Chat Module -->
        <div id="chat-module-placeholder"></div>

        <!-- Custom JavaScript for lesson detail page -->
        <script src="/api/client-lessons-data.js"></script>
        <script type="module" src="/js/lesson_detail.js"></script>
        <script type="module">
            // Load chat module HTML
            fetch('/html/chat_module.html')
                .then(response => response.text())
                .then(html => {
                    document.getElementById('chat-module-placeholder').innerHTML = html;
                    // Dynamically import chat_module.js after HTML is loaded
                    import('/js/chat_module.js')
                        .then(module => {
                            // Call the initChatModule function from the imported module
                            if (typeof module.initChatModule === 'function') {
                                module.initChatModule();
                            }
                            // Pass lessonsData context to chat module.
                            // window.lessonsData is already global from lesson_detail.js
                            if (typeof module.setChatContext === 'function' && typeof window.lessonsData !== 'undefined') {
                                // On lesson detail page, pass the entire lessonsData structure
                                // so AI can answer about current lesson and other potential lessons.
                                module.setChatContext(window.lessonsData); 
                            } else {
                                console.warn("window.lessonsData not fully available for chat context. AI might have limited context.");
                            }
                        })
                        .catch(error => console.error('Error loading chat_module.js:', error));
                })
                .catch(error => console.error('Error loading chat_module.html:', error));
            
            // Event listener for the new back button from pre-test to home
            document.getElementById('backFromPreTestToHomeBtn')?.addEventListener('click', () => {
                window.location.href = '/html/home.html';
            });

            // Ensure the backToHomeBtn at the top works as expected
            document.getElementById('backToHomeBtn')?.addEventListener('click', () => {
                window.location.href = '/html/home.html';
            });
        </script>
    </body>
    </html>
